<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Nat-ur</title>
  <link rel="manifest" href="./manifest.webmanifest?v=3.0.1">
  <link rel="icon" href="./icons/icon.svg?v=3.0.1" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=3.0.1">
</head>
<body>
  <main class="app">
    <section class="clock-screen" aria-label="Ur">
      <div id="clock" class="clock">--:--</div>
      <div id="seconds" class="seconds" hidden>--</div>
    </section>

    <button id="settingsButton" class="settings-button" type="button" aria-label="Åbn indstillinger">⚙</button>

    <section id="settingsOverlay" class="overlay" hidden>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <header class="panel-header">
          <h1 id="settingsTitle">Indstillinger</h1>
          <button id="closeSettings" class="close-button" type="button" aria-label="Luk">×</button>
        </header>

        <section class="section first">
          <div class="label-row">
            <label for="brightness">Lysstyrke</label>
            <output id="brightnessValue">28 %</output>
          </div>
          <input id="brightness" type="range" min="8" max="70" value="28">
        </section>

        <section class="section compact">
          <label class="toggle-row">
            <span>Vis sekunder</span>
            <input id="showSeconds" type="checkbox">
            <span class="toggle-ui"></span>
          </label>
        </section>

        <section class="section">
          <h2>Status</h2>
          <div class="status-row">
            <span id="wakeDot" class="status-dot waiting"></span>
            <span id="wakeText">Aktiverer Wake Lock…</span>
          </div>
        </section>

        <section class="section">
          <h2>Alarm</h2>
          <div class="alarm-row">
            <input id="alarmTime" type="time" value="07:00" aria-label="Alarmtid">
            <label class="toggle-row alarm-toggle">
              <span>Aktiv</span>
              <input id="alarmEnabled" type="checkbox">
              <span class="toggle-ui"></span>
            </label>
          </div>

          <div class="label-row volume-label">
            <label for="alarmVolume">Lydstyrke</label>
            <output id="alarmVolumeValue">60 %</output>
          </div>
          <input id="alarmVolume" type="range" min="5" max="100" value="60">

          <button id="testAlarm" class="action-button" type="button">▶&nbsp;&nbsp; Test alarm</button>
          <button id="stopAlarm" class="action-button stop" type="button" hidden>Stop alarm</button>
        </section>

        <footer>Version 3.0.1</footer>
      </div>
    </section>
  </main>

  <script src="./app.js?v=3.0.1"></script>
</body>
</html>
