<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Nat-ur</title>
  <link rel="manifest" href="./manifest.webmanifest?v=4.0.1">
  <link rel="icon" href="./icons/icon.svg?v=4.0.1" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}
    :root{color-scheme:dark;--clock-alpha:.34;--blue:132,174,255;--line:rgba(148,163,184,.17)}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000!important;overscroll-behavior:none}
    body{min-height:100dvh;touch-action:manipulation;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f7fb;-webkit-tap-highlight-color:transparent}
    button,input{font:inherit}
    button{color:inherit}
    [hidden]{display:none!important}
    .app{position:relative;width:100%;height:100dvh;background:#000}
    .clock-screen{width:100%;height:100%;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));color:rgba(var(--blue),var(--clock-alpha));text-align:center}
    .clock{font-size:clamp(7rem,31vw,23rem);line-height:.82;font-weight:520;letter-spacing:-.065em;font-variant-numeric:tabular-nums;white-space:nowrap}
    .seconds{margin-top:clamp(1rem,3vh,2.5rem);font-size:clamp(2rem,8vw,5.5rem);font-weight:500;color:rgba(var(--blue),calc(var(--clock-alpha)*.88));font-variant-numeric:tabular-nums}
    .settings-button{position:fixed;z-index:20;top:max(18px,env(safe-area-inset-top));right:max(18px,env(safe-area-inset-right));width:56px;height:56px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;background:rgba(132,174,255,.035);color:rgb(var(--blue));opacity:.42;cursor:pointer;touch-action:manipulation}
    .settings-button:active{opacity:.8;background:rgba(132,174,255,.1)}
    .settings-button svg{display:block;width:35px;height:35px;fill:currentColor;pointer-events:none}
    .overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:rgba(0,0,0,.9)}
    .panel{width:min(620px,100%);max-height:calc(100dvh - 28px);overflow:auto;padding:26px 28px 22px;border:1px solid rgba(148,163,184,.25);border-radius:24px;background:#0b0f15;box-shadow:0 24px 80px rgba(0,0,0,.8)}
    .panel-header,.label-row,.status-row,.alarm-row,.toggle-row{display:flex;align-items:center}
    .panel-header{justify-content:space-between;gap:20px;margin-bottom:14px}
    .panel-header h1{margin:0;color:rgb(var(--blue));font-size:1.55rem;font-weight:720}
    .close-button{width:48px;height:48px;flex:none;border:0;border-radius:50%;background:rgba(255,255,255,.055);color:rgb(var(--blue));font-size:2.25rem;font-weight:300;line-height:1;cursor:pointer;touch-action:manipulation}
    .section{padding:21px 0;border-top:1px solid var(--line)}
    .section.first{border-top:0}
    .section.compact{padding:17px 0}
    .section h2{margin:0 0 15px;color:rgb(var(--blue));font-size:1.08rem;font-weight:700}
    .label-row{justify-content:space-between;gap:18px;margin-bottom:10px;font-size:1.04rem;font-weight:570}
    .label-row output{color:rgb(var(--blue));font-variant-numeric:tabular-nums}
    input[type=range]{width:100%;height:34px;margin:0;accent-color:rgb(var(--blue))}
    .toggle-row{position:relative;justify-content:space-between;gap:18px;min-height:42px;font-size:1.04rem;font-weight:570;cursor:pointer}
    .toggle-row input{position:absolute;width:1px;height:1px;opacity:0}
    .toggle-ui{position:relative;width:54px;height:30px;flex:none;border:1px solid rgba(148,163,184,.35);border-radius:999px;background:#252b35}
    .toggle-ui:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#ecf0f6;transition:transform .16s}
    .toggle-row input:checked + .toggle-ui{background:rgb(var(--blue));border-color:rgb(var(--blue))}
    .toggle-row input:checked + .toggle-ui:after{transform:translateX(24px)}
    .status-row{gap:12px;min-height:38px;font-size:1.02rem;font-weight:570}
    .status-dot{width:13px;height:13px;flex:none;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}
    .status-dot.active{color:#70d070}.status-dot.waiting{color:#deb75d}.status-dot.error{color:#e96f6f}
    .alarm-row{justify-content:space-between;gap:20px}
    #alarmTime{flex:1;min-width:0;min-height:52px;padding:0 15px;border:1px solid rgba(148,163,184,.24);border-radius:12px;background:#0d121a;color:#fff}
    .alarm-toggle{flex:none}
    .volume-label{margin-top:22px}
    .action-button{width:100%;min-height:54px;margin-top:18px;border:1px solid rgba(148,163,184,.22);border-radius:12px;background:#1b212b;color:rgb(var(--blue));font-weight:680;cursor:pointer;touch-action:manipulation}
    .action-button.stop{color:#ff9b9b}
    footer{padding-top:3px;color:#646e7d;font-size:.84rem}
    body.alarming .clock-screen{animation:pulse .8s infinite alternate}
    @keyframes pulse{from{opacity:1}to{opacity:.48}}
    @media (orientation:landscape){.clock{font-size:min(48vh,31vw)}.seconds{font-size:min(11vh,7vw);margin-top:2vh}.panel{width:min(660px,78vw)}}
    @media (max-width:520px){.panel{padding:21px 21px 18px}.alarm-row{align-items:flex-end}}
  </style>
</head>
<body>
  <main class="app">
    <section class="clock-screen" aria-label="Ur">
      <div id="clock" class="clock">--:--</div>
      <div id="seconds" class="seconds" hidden>--</div>
    </section>

    <button id="settingsButton" class="settings-button" type="button" aria-label="Åbn indstillinger">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.1 7.1 0 0 0-1.62-.94l-.36-2.54a.49.49 0 0 0-.49-.42h-3.84a.5.5 0 0 0-.49.42L9.2 5.32c-.58.24-1.12.55-1.62.93l-2.39-.95a.5.5 0 0 0-.61.22L2.66 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.05.31-.08.65-.08.96 0 .3.03.61.08.92L2.78 14.52a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.61.22l2.39-.96c.5.39 1.04.7 1.62.94l.36 2.54c.04.24.24.42.49.42h3.84c.25 0 .45-.18.49-.42l.36-2.54a7.1 7.1 0 0 0 1.62-.94l2.39.96c.22.08.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.02-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/></svg>
    </button>

    <section id="settingsOverlay" class="overlay" hidden>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <header class="panel-header">
          <h1 id="settingsTitle">Indstillinger</h1>
          <button id="closeSettings" class="close-button" type="button" aria-label="Luk">×</button>
        </header>

        <section class="section first">
          <div class="label-row"><label for="brightness">Lysstyrke</label><output id="brightnessValue">34 %</output></div>
          <input id="brightness" type="range" min="8" max="70" value="34">
        </section>

        <section class="section">
          <div class="label-row"><label for="clockSize">Urets størrelse</label><output id="clockSizeValue">100 %</output></div>
          <input id="clockSize" type="range" min="60" max="220" step="1" value="100">
        </section>

        <section class="section compact">
          <label class="toggle-row"><span>Vis sekunder</span><input id="showSeconds" type="checkbox"><span class="toggle-ui" aria-hidden="true"></span></label>
        </section>

        <section class="section">
          <h2>Status</h2>
          <div class="status-row"><span id="wakeDot" class="status-dot waiting"></span><span id="wakeText">Aktiverer Wake Lock…</span></div>
        </section>

        <section class="section">
          <h2>Alarm</h2>
          <div class="alarm-row">
            <input id="alarmTime" type="time" value="07:00" aria-label="Alarmtid">
            <label class="toggle-row alarm-toggle"><span>Aktiv</span><input id="alarmEnabled" type="checkbox"><span class="toggle-ui" aria-hidden="true"></span></label>
          </div>
          <div class="label-row volume-label"><label for="alarmVolume">Lydstyrke</label><output id="alarmVolumeValue">60 %</output></div>
          <input id="alarmVolume" type="range" min="5" max="100" value="60">
          <button id="testAlarm" class="action-button" type="button">▶&nbsp;&nbsp; Test alarm</button>
          <button id="stopAlarm" class="action-button stop" type="button" hidden>Stop alarm</button>
        </section>
        <footer>Version 4.0.1</footer>
      </div>
    </section>
  </main>

  <script>
  (()=>{
    'use strict';
    const VERSION='4.0.0';
    const $=id=>document.getElementById(id);
    const el={clock:$('clock'),seconds:$('seconds'),settingsButton:$('settingsButton'),overlay:$('settingsOverlay'),closeSettings:$('closeSettings'),brightness:$('brightness'),brightnessValue:$('brightnessValue'),clockSize:$('clockSize'),clockSizeValue:$('clockSizeValue'),showSeconds:$('showSeconds'),wakeDot:$('wakeDot'),wakeText:$('wakeText'),alarmTime:$('alarmTime'),alarmEnabled:$('alarmEnabled'),alarmVolume:$('alarmVolume'),alarmVolumeValue:$('alarmVolumeValue'),testAlarm:$('testAlarm'),stopAlarm:$('stopAlarm')};
    const defaults={brightness:34,clockSize:100,showSeconds:false,alarmTime:'07:00',alarmEnabled:false,alarmVolume:60};
    let wakeLock=null,wakeRetry=null,audioContext=null,oscillator=null,gainNode=null,toneTimer=null,lastAlarmKey='',reloading=false;

    function settings(){try{return {...defaults,...JSON.parse(localStorage.getItem('natUrSettings')||'{}')}}catch{return {...defaults}}}
    function applyClockSize(){const value=Number(el.clockSize.value)||defaults.clockSize,scale=value/100,landscape=matchMedia('(orientation: landscape)').matches;el.clock.style.fontSize=landscape?`min(${48*scale}vh,${31*scale}vw)`:`clamp(${5*scale}rem,${31*scale}vw,${23*scale}rem)`;el.clockSizeValue.textContent=`${value} %`}function apply(){const value=Number(el.brightness.value)||defaults.brightness;document.documentElement.style.setProperty('--clock-alpha',String(value/100));el.brightnessValue.textContent=`${value} %`;el.alarmVolumeValue.textContent=`${el.alarmVolume.value} %`;el.seconds.hidden=!el.showSeconds.checked;applyClockSize()}
    function save(){localStorage.setItem('natUrSettings',JSON.stringify({brightness:Number(el.brightness.value),clockSize:Number(el.clockSize.value),showSeconds:el.showSeconds.checked,alarmTime:el.alarmTime.value||defaults.alarmTime,alarmEnabled:el.alarmEnabled.checked,alarmVolume:Number(el.alarmVolume.value)}));apply()}
    function load(){const s=settings();el.brightness.value=s.brightness;el.clockSize.value=s.clockSize||defaults.clockSize;el.showSeconds.checked=Boolean(s.showSeconds);el.alarmTime.value=s.alarmTime||defaults.alarmTime;el.alarmEnabled.checked=Boolean(s.alarmEnabled);el.alarmVolume.value=s.alarmVolume;apply()}
    function tick(){const now=new Date(),hh=String(now.getHours()).padStart(2,'0'),mm=String(now.getMinutes()).padStart(2,'0'),ss=String(now.getSeconds()).padStart(2,'0');el.clock.textContent=`${hh}:${mm}`;el.seconds.textContent=ss;checkAlarm(now,`${hh}:${mm}`)}
    function wakeStatus(state,text){el.wakeDot.className=`status-dot ${state}`;el.wakeText.textContent=text}
    async function requestWakeLock(){clearTimeout(wakeRetry);if(!('wakeLock'in navigator)){wakeStatus('error','Wake Lock understøttes ikke');return}if(document.visibilityState!=='visible'){wakeStatus('waiting','Venter på at appen bliver aktiv');return}if(wakeLock&&!wakeLock.released){wakeStatus('active','Skærmen holdes vågen');return}wakeStatus('waiting','Aktiverer Wake Lock…');try{wakeLock=await navigator.wakeLock.request('screen');wakeStatus('active','Skærmen holdes vågen');wakeLock.addEventListener('release',()=>{wakeLock=null;if(document.visibilityState==='visible'){wakeStatus('waiting','Genaktiverer Wake Lock…');wakeRetry=setTimeout(requestWakeLock,800)}},{once:true})}catch{wakeStatus('error','Wake Lock kunne ikke aktiveres');wakeRetry=setTimeout(requestWakeLock,3000)}}
    function checkAlarm(now,current){if(!el.alarmEnabled.checked||!el.alarmTime.value||document.body.classList.contains('alarming'))return;const key=`${now.getFullYear()}-${now.getMonth()}-${now.getDate()}-${current}`;if(current===el.alarmTime.value&&key!==lastAlarmKey){lastAlarmKey=key;startAlarm()}}
    async function startAlarm(){stopAlarm();const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{audioContext=new AC();await audioContext.resume();oscillator=audioContext.createOscillator();gainNode=audioContext.createGain();oscillator.type='sine';oscillator.frequency.value=760;gainNode.gain.value=(Number(el.alarmVolume.value)/100)*.24;oscillator.connect(gainNode);gainNode.connect(audioContext.destination);oscillator.start();let high=false;toneTimer=setInterval(()=>{high=!high;if(oscillator&&audioContext)oscillator.frequency.setValueAtTime(high?940:760,audioContext.currentTime)},480);document.body.classList.add('alarming');el.stopAlarm.hidden=false;if(navigator.vibrate)navigator.vibrate([500,250,500,250,900])}catch{stopAlarm()}}
    function stopAlarm(){if(toneTimer)clearInterval(toneTimer);toneTimer=null;try{oscillator?.stop()}catch{}try{audioContext?.close()}catch{}oscillator=gainNode=audioContext=null;document.body.classList.remove('alarming');el.stopAlarm.hidden=true;if(navigator.vibrate)navigator.vibrate(0)}
    function openMenu(){el.overlay.hidden=false;el.closeSettings.focus();requestWakeLock()}
    function closeMenu(){el.overlay.hidden=true;el.settingsButton.focus()}
    async function enterFullscreen(){if(document.fullscreenElement||!document.documentElement.requestFullscreen)return;try{await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch{}}
    function bind(){[el.brightness,el.clockSize,el.showSeconds,el.alarmTime,el.alarmEnabled,el.alarmVolume].forEach(node=>{node.addEventListener('input',save);node.addEventListener('change',save)});el.settingsButton.addEventListener('click',()=>{openMenu();enterFullscreen()});el.closeSettings.addEventListener('click',closeMenu);el.overlay.addEventListener('click',e=>{if(e.target===el.overlay)closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!el.overlay.hidden)closeMenu()});el.testAlarm.addEventListener('click',startAlarm);el.stopAlarm.addEventListener('click',stopAlarm);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();requestWakeLock();checkUpdates()}});document.addEventListener('pointerdown',requestWakeLock,{passive:true});window.addEventListener('resize',applyClockSize)}
    async function checkUpdates(){if(!('serviceWorker'in navigator))return;try{const r=await navigator.serviceWorker.getRegistration();await r?.update()}catch{}}
    function installSW(){if(!('serviceWorker'in navigator))return;window.addEventListener('load',async()=>{try{const r=await navigator.serviceWorker.register('./sw.js?v=4.0.1',{updateViaCache:'none'});r.addEventListener('updatefound',()=>{const w=r.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)w.postMessage({type:'SKIP_WAITING'})})});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload()});setInterval(checkUpdates,30*60*1000)}catch{}})}
    load();tick();bind();requestWakeLock();installSW();setInterval(tick,1000);
  })();
  </script>
</body>
</html>
