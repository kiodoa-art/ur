<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Nat-ur</title>
  <link rel="manifest" href="./manifest.webmanifest?v=5.0.0">
  <link rel="icon" href="./icons/icon.svg?v=5.0.0" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}
    :root{color-scheme:dark;--clock-alpha:.34;--blue:132,174,255;--line:rgba(148,163,184,.17)}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000!important;overscroll-behavior:none}
    body{min-height:100dvh;touch-action:manipulation;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f7fb;-webkit-tap-highlight-color:transparent}
    button,input{font:inherit}
    button{color:inherit}
    [hidden]{display:none!important}
    .app{position:relative;width:100%;height:100dvh;background:#000}
    .clock-screen{width:100%;height:100%;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));color:rgba(var(--blue),var(--clock-alpha));text-align:center}
    .clock{font-size:clamp(7rem,31vw,23rem);line-height:.82;font-weight:520;letter-spacing:-.065em;font-variant-numeric:tabular-nums;white-space:nowrap}
    .seconds{margin-top:clamp(1rem,3vh,2.5rem);font-size:clamp(2rem,8vw,5.5rem);font-weight:500;color:rgba(var(--blue),calc(var(--clock-alpha)*.88));font-variant-numeric:tabular-nums}
    .settings-button{position:fixed;z-index:20;top:max(18px,env(safe-area-inset-top));right:max(18px,env(safe-area-inset-right));width:56px;height:56px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;background:rgba(132,174,255,.035);color:rgb(var(--blue));opacity:var(--clock-alpha);cursor:pointer;touch-action:manipulation}
    .settings-button:active{opacity:.8;background:rgba(132,174,255,.1)}
    .settings-button svg{display:block;width:35px;height:35px;fill:currentColor;pointer-events:none}
    .overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:rgba(0,0,0,.9)}
    .panel{width:min(620px,100%);max-height:calc(100dvh - 28px);overflow:auto;padding:26px 28px 22px;border:1px solid rgba(148,163,184,.25);border-radius:24px;background:#0b0f15;box-shadow:0 24px 80px rgba(0,0,0,.8)}
    .panel-header,.label-row,.status-row,.alarm-row,.toggle-row{display:flex;align-items:center}
    .panel-header{justify-content:space-between;gap:20px;margin-bottom:14px}
    .panel-header h1{margin:0;color:rgb(var(--blue));font-size:1.55rem;font-weight:720}
    .close-button{width:48px;height:48px;flex:none;border:0;border-radius:50%;background:rgba(255,255,255,.055);color:rgb(var(--blue));font-size:2.25rem;font-weight:300;line-height:1;cursor:pointer;touch-action:manipulation}
    .section{padding:21px 0;border-top:1px solid var(--line)}
    .section.first{border-top:0}
    .section.compact{padding:17px 0}
    .section h2{margin:0 0 15px;color:rgb(var(--blue));font-size:1.08rem;font-weight:700}
    .label-row{justify-content:space-between;gap:18px;margin-bottom:10px;font-size:1.04rem;font-weight:570}
    .label-row output{color:rgb(var(--blue));font-variant-numeric:tabular-nums}
    input[type=range]{width:100%;height:34px;margin:0;accent-color:rgb(var(--blue))}
    .toggle-row{position:relative;justify-content:space-between;gap:18px;min-height:42px;font-size:1.04rem;font-weight:570;cursor:pointer}
    .toggle-row input{position:absolute;width:1px;height:1px;opacity:0}
    .toggle-ui{position:relative;width:54px;height:30px;flex:none;border:1px solid rgba(148,163,184,.35);border-radius:999px;background:#252b35}
    .toggle-ui:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#ecf0f6;transition:transform .16s}
    .toggle-row input:checked + .toggle-ui{background:rgb(var(--blue));border-color:rgb(var(--blue))}
    .toggle-row input:checked + .toggle-ui:after{transform:translateX(24px)}
    .status-row{gap:12px;min-height:38px;font-size:1.02rem;font-weight:570}
    .status-dot{width:13px;height:13px;flex:none;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}
    .status-dot.active{color:#70d070}.status-dot.waiting{color:#deb75d}.status-dot.error{color:#e96f6f}
    .alarm-row{justify-content:space-between;gap:20px}
    #alarmTime{flex:1;min-width:0;min-height:52px;padding:0 15px;border:1px solid rgba(148,163,184,.24);border-radius:12px;background:#0d121a;color:#fff}
    .alarm-toggle{flex:none}
    .volume-label{margin-top:22px}
    .action-button{width:100%;min-height:54px;margin-top:18px;border:1px solid rgba(148,163,184,.22);border-radius:12px;background:#1b212b;color:rgb(var(--blue));font-weight:680;cursor:pointer;touch-action:manipulation}
    .action-button.stop{color:#ff9b9b}
    footer{padding-top:3px;color:#646e7d;font-size:.84rem}
    body.alarming .clock-screen{animation:pulse .8s infinite alternate}
    @keyframes pulse{from{opacity:1}to{opacity:.48}}

    .alarm-summary{margin-top:clamp(.8rem,2vh,1.5rem);font-size:clamp(.82rem,2.3vw,1.1rem);font-weight:520;letter-spacing:.035em;color:rgba(var(--blue),calc(var(--clock-alpha)*.72));font-variant-numeric:tabular-nums}
    .alarm-settings{display:grid;gap:16px}
    .alarm-time-row{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
    .alarm-time-label{font-size:1.04rem;font-weight:570}
    #systemAlarmTime{width:100%;min-height:56px;padding:0 16px;border:1px solid rgba(148,163,184,.24);border-radius:12px;background:#0d121a;color:#f5f7fb;font-size:1.15rem;font-weight:620;color-scheme:dark}
    .system-alarm-button,.fallback-alarm-button{width:100%;min-height:54px;border:1px solid rgba(132,174,255,.24);border-radius:12px;background:#18202d;color:rgba(var(--blue),.9);font-weight:680;cursor:pointer;touch-action:manipulation}
    .system-alarm-button:active,.fallback-alarm-button:active{background:#202b3c}
    .alarm-message{min-height:1.45em;margin:0;color:#9aa5b6;font-size:.92rem;line-height:1.45}
    .alarm-message.success{color:#9eb8e8}.alarm-message.error{color:#d59696}.alarm-message.warning{color:#c9b27a}
    .alarm-note{margin:0;color:#697486;font-size:.82rem;line-height:1.45}
    @media (orientation:landscape){.clock{font-size:min(48vh,31vw)}.seconds{font-size:min(11vh,7vw);margin-top:2vh}.panel{width:min(660px,78vw)}}
    @media (max-width:520px){.panel{padding:21px 21px 18px}.alarm-row{align-items:flex-end}}
  </style>
</head>
<body>
  <main class="app">
    <section class="clock-screen" aria-label="Ur">
      <div id="clock" class="clock">--:--</div>
      <div id="seconds" class="seconds" hidden>--</div>
      <div id="alarmSummary" class="alarm-summary" hidden>Alarm: 07:00</div>
    </section>

    <button id="settingsButton" class="settings-button" type="button" aria-label="Åbn indstillinger">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.1 7.1 0 0 0-1.62-.94l-.36-2.54a.49.49 0 0 0-.49-.42h-3.84a.5.5 0 0 0-.49.42L9.2 5.32c-.58.24-1.12.55-1.62.93l-2.39-.95a.5.5 0 0 0-.61.22L2.66 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.05.31-.08.65-.08.96 0 .3.03.61.08.92L2.78 14.52a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.61.22l2.39-.96c.5.39 1.04.7 1.62.94l.36 2.54c.04.24.24.42.49.42h3.84c.25 0 .45-.18.49-.42l.36-2.54a7.1 7.1 0 0 0 1.62-.94l2.39.96c.22.08.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.02-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/></svg>
    </button>

    <section id="settingsOverlay" class="overlay" hidden>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <header class="panel-header">
          <h1 id="settingsTitle">Indstillinger</h1>
          <button id="closeSettings" class="close-button" type="button" aria-label="Luk">×</button>
        </header>

        <section class="section first">
          <div class="label-row"><label for="brightness">Lysstyrke</label><output id="brightnessValue">34 %</output></div>
          <input id="brightness" type="range" min="8" max="70" value="34">
        </section>

        <section class="section">
          <div class="label-row"><label for="clockSize">Urets størrelse</label><output id="clockSizeValue">100 %</output></div>
          <input id="clockSize" type="range" min="60" max="220" step="1" value="100">
        </section>

        <section class="section compact">
          <label class="toggle-row"><span>Vis sekunder</span><input id="showSeconds" type="checkbox"><span class="toggle-ui" aria-hidden="true"></span></label>
        </section>

        <section class="section">
          <h2>Status</h2>
          <div class="status-row"><span id="wakeDot" class="status-dot waiting"></span><span id="wakeText">Aktiverer Wake Lock…</span></div>
        </section>

        <section class="section">
          <h2>Telefonalarm</h2>
          <div class="alarm-settings">
            <div class="alarm-time-row">
              <label class="alarm-time-label" for="systemAlarmTime">Alarmtidspunkt</label>
              <input id="systemAlarmTime" type="time" value="07:00" inputmode="none">
            </div>

            <label class="toggle-row">
              <span>Vis alarmtid under uret</span>
              <input id="showAlarmSummary" type="checkbox" checked>
              <span class="toggle-ui" aria-hidden="true"></span>
            </label>

            <button id="setSystemAlarm" class="system-alarm-button" type="button">Sæt telefonens alarm</button>
            <button id="openAlarmApp" class="fallback-alarm-button" type="button" hidden>Åbn alarm-appen</button>
            <p id="alarmMessage" class="alarm-message" role="status" aria-live="polite"></p>
            <p class="alarm-note">Tidspunktet her er kun det senest valgte. PWA’en kan ikke kontrollere, om alarmen faktisk er aktiv i Android.</p>
          </div>
        </section>
        <footer>Version 5.0.0</footer>
      </div>
    </section>
  </main>

  <script>
  (()=>{
    'use strict';

    const VERSION='5.0.0';
    const $=id=>document.getElementById(id);
    const el={
      clock:$('clock'),seconds:$('seconds'),alarmSummary:$('alarmSummary'),
      settingsButton:$('settingsButton'),overlay:$('settingsOverlay'),closeSettings:$('closeSettings'),
      brightness:$('brightness'),brightnessValue:$('brightnessValue'),clockSize:$('clockSize'),clockSizeValue:$('clockSizeValue'),
      showSeconds:$('showSeconds'),wakeDot:$('wakeDot'),wakeText:$('wakeText'),
      systemAlarmTime:$('systemAlarmTime'),showAlarmSummary:$('showAlarmSummary'),setSystemAlarm:$('setSystemAlarm'),
      openAlarmApp:$('openAlarmApp'),alarmMessage:$('alarmMessage')
    };

    const defaults={brightness:34,clockSize:100,showSeconds:false,systemAlarmTime:'07:00',showAlarmSummary:true};
    let wakeLock=null,wakeRetry=null,reloading=false;

    function readSettings(){
      try{
        const stored=JSON.parse(localStorage.getItem('natUrSettings')||'{}');
        return {...defaults,...stored,systemAlarmTime:stored.systemAlarmTime||stored.alarmTime||defaults.systemAlarmTime};
      }catch{return {...defaults}}
    }

    function applyClockSize(){
      const value=Math.max(60,Math.min(220,Number(el.clockSize.value)||defaults.clockSize));
      const scale=value/100;
      const landscape=matchMedia('(orientation: landscape)').matches;
      el.clock.style.fontSize=landscape?`min(${48*scale}vh,${31*scale}vw)`:`clamp(${5*scale}rem,${31*scale}vw,${23*scale}rem)`;
      el.clockSizeValue.textContent=`${value} %`;
    }

    function apply(){
      const brightness=Math.max(8,Math.min(70,Number(el.brightness.value)||defaults.brightness));
      document.documentElement.style.setProperty('--clock-alpha',String(brightness/100));
      el.brightnessValue.textContent=`${brightness} %`;
      el.seconds.hidden=!el.showSeconds.checked;
      applyClockSize();
      updateAlarmSummary();
    }

    function save(){
      localStorage.setItem('natUrSettings',JSON.stringify({
        brightness:Number(el.brightness.value),clockSize:Number(el.clockSize.value),showSeconds:el.showSeconds.checked,
        systemAlarmTime:el.systemAlarmTime.value||defaults.systemAlarmTime,showAlarmSummary:el.showAlarmSummary.checked
      }));
      apply();
    }

    function load(){
      const s=readSettings();
      el.brightness.value=s.brightness;
      el.clockSize.value=s.clockSize||defaults.clockSize;
      el.showSeconds.checked=Boolean(s.showSeconds);
      el.systemAlarmTime.value=s.systemAlarmTime||defaults.systemAlarmTime;
      el.showAlarmSummary.checked=s.showAlarmSummary!==false;
      apply();
    }

    function tick(){
      const now=new Date();
      const hh=String(now.getHours()).padStart(2,'0');
      const mm=String(now.getMinutes()).padStart(2,'0');
      const ss=String(now.getSeconds()).padStart(2,'0');
      el.clock.textContent=`${hh}:${mm}`;
      el.seconds.textContent=ss;
    }

    function updateAlarmSummary(){
      const time=el.systemAlarmTime.value||defaults.systemAlarmTime;
      el.alarmSummary.textContent=`Alarm: ${time}`;
      el.alarmSummary.hidden=!el.showAlarmSummary.checked;
    }

    function wakeStatus(state,text){el.wakeDot.className=`status-dot ${state}`;el.wakeText.textContent=text}

    async function requestWakeLock(){
      clearTimeout(wakeRetry);
      if(!('wakeLock' in navigator)){wakeStatus('error','Wake Lock understøttes ikke');return}
      if(document.visibilityState!=='visible'){wakeStatus('waiting','Venter på at appen bliver aktiv');return}
      if(wakeLock&&!wakeLock.released){wakeStatus('active','Skærmen holdes vågen');return}
      wakeStatus('waiting','Aktiverer Wake Lock…');
      try{
        wakeLock=await navigator.wakeLock.request('screen');
        wakeStatus('active','Skærmen holdes vågen');
        wakeLock.addEventListener('release',()=>{
          wakeLock=null;
          if(document.visibilityState==='visible'){
            wakeStatus('waiting','Genaktiverer Wake Lock…');
            wakeRetry=setTimeout(requestWakeLock,800);
          }
        },{once:true});
      }catch{
        wakeStatus('error','Wake Lock kunne ikke aktiveres');
        wakeRetry=setTimeout(requestWakeLock,3000);
      }
    }

    function isAndroid(){
      if(navigator.userAgentData?.platform)return navigator.userAgentData.platform.toLowerCase()==='android';
      return /Android/i.test(navigator.userAgent||'');
    }

    function setAlarmMessage(text,type=''){
      el.alarmMessage.textContent=text;
      el.alarmMessage.className=`alarm-message${type?` ${type}`:''}`;
    }

    function fallbackUrl(reason){
      const url=new URL(location.href);
      url.searchParams.set('alarmFallback',reason);
      return url.href;
    }

    function buildSetAlarmIntent(hour,minutes){
      const fallback=encodeURIComponent(fallbackUrl('set'));
      return `intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${hour};i.android.intent.extra.alarm.MINUTES=${minutes};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent('Natbord')};B.android.intent.extra.alarm.SKIP_UI=false;S.browser_fallback_url=${fallback};end`;
    }

    function buildShowAlarmsIntent(){
      const fallback=encodeURIComponent(fallbackUrl('show'));
      return `intent:#Intent;action=android.intent.action.SHOW_ALARMS;S.browser_fallback_url=${fallback};end`;
    }

    function launchIntent(uri){
      const anchor=document.createElement('a');
      anchor.href=uri;
      anchor.style.display='none';
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    }

    function setPhoneAlarm(){
      save();
      el.openAlarmApp.hidden=true;

      if(!isAndroid()){
        setAlarmMessage('Systemalarm-integrationen kræver Android. Åbn enhedens alarm-app manuelt.','warning');
        return;
      }

      const value=el.systemAlarmTime.value;
      if(!/^([01]\\d|2[0-3]):[0-5]\\d$/.test(value)){
        setAlarmMessage('Vælg et gyldigt alarmtidspunkt først.','error');
        return;
      }

      const [hour,minutes]=value.split(':').map(Number);
      localStorage.setItem('natUrAlarmIntentPending',JSON.stringify({time:value,at:Date.now()}));
      setAlarmMessage('Alarm-appen åbnes. Kontrollér, at alarmen er gemt.','success');

      try{launchIntent(buildSetAlarmIntent(hour,minutes))}
      catch{
        el.openAlarmApp.hidden=false;
        setAlarmMessage('Kunne ikke sende alarmen. Prøv at åbne alarm-appen nedenfor.','error');
      }
    }

    function openPhoneAlarmApp(){
      if(!isAndroid()){
        setAlarmMessage('Alarm-appen skal åbnes manuelt på denne enhed.','warning');
        return;
      }
      setAlarmMessage('Alarm-appen åbnes. Opret alarmen manuelt, hvis tidspunktet ikke er udfyldt.','success');
      try{launchIntent(buildShowAlarmsIntent())}
      catch{setAlarmMessage('Alarm-appen kunne ikke åbnes. Åbn den manuelt på telefonen.','error')}
    }

    function handleAlarmFallback(){
      const url=new URL(location.href);
      const reason=url.searchParams.get('alarmFallback');
      if(!reason)return;
      url.searchParams.delete('alarmFallback');
      history.replaceState(null,'',url.pathname+url.search+url.hash);
      el.overlay.hidden=false;
      el.openAlarmApp.hidden=false;
      if(reason==='show')setAlarmMessage('Android kunne ikke åbne alarm-appen herfra. Åbn den manuelt.','error');
      else setAlarmMessage('Telefonen accepterede ikke alarm-intentet. Prøv knappen “Åbn alarm-appen”.','error');
    }

    function openMenu(){el.overlay.hidden=false;el.closeSettings.focus();requestWakeLock()}
    function closeMenu(){el.overlay.hidden=true;el.settingsButton.focus()}

    async function enterFullscreen(){
      if(document.fullscreenElement||!document.documentElement.requestFullscreen)return;
      try{await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch{}
    }

    function bind(){
      [el.brightness,el.clockSize,el.showSeconds,el.systemAlarmTime,el.showAlarmSummary].forEach(node=>{
        node.addEventListener('input',save);node.addEventListener('change',save);
      });
      el.settingsButton.addEventListener('click',()=>{openMenu();enterFullscreen()});
      el.closeSettings.addEventListener('click',closeMenu);
      el.overlay.addEventListener('click',e=>{if(e.target===el.overlay)closeMenu()});
      document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!el.overlay.hidden)closeMenu()});
      el.setSystemAlarm.addEventListener('click',setPhoneAlarm);
      el.openAlarmApp.addEventListener('click',openPhoneAlarmApp);
      document.addEventListener('visibilitychange',()=>{
        if(document.visibilityState==='visible'){
          tick();requestWakeLock();checkUpdates();
          const pending=localStorage.getItem('natUrAlarmIntentPending');
          if(pending){
            localStorage.removeItem('natUrAlarmIntentPending');
            setAlarmMessage('Tilbage fra alarm-appen. Kontrollér, at alarmen “Natbord” er gemt.','success');
          }
        }
      });
      document.addEventListener('pointerdown',requestWakeLock,{passive:true});
      window.addEventListener('resize',applyClockSize);
    }

    async function checkUpdates(){
      if(!('serviceWorker' in navigator))return;
      try{const r=await navigator.serviceWorker.getRegistration();await r?.update()}catch{}
    }

    function installSW(){
      if(!('serviceWorker' in navigator))return;
      window.addEventListener('load',async()=>{
        try{
          const r=await navigator.serviceWorker.register('./sw.js?v=5.0.0',{updateViaCache:'none'});
          r.addEventListener('updatefound',()=>{
            const w=r.installing;if(!w)return;
            w.addEventListener('statechange',()=>{
              if(w.state==='installed'&&navigator.serviceWorker.controller)w.postMessage({type:'SKIP_WAITING'});
            });
          });
          navigator.serviceWorker.addEventListener('controllerchange',()=>{
            if(reloading)return;reloading=true;location.reload();
          });
          setInterval(checkUpdates,30*60*1000);
        }catch{}
      });
    }

    load();tick();bind();requestWakeLock();handleAlarmFallback();installSW();setInterval(tick,1000);
  })();
  </script>
</body>
</html>
